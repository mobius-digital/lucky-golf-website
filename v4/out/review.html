<title>Lucky Golf v4 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* Single theme on purpose: this shell wears Lucky's own chrome (ink + gold),
   so the pages under review sit in the world they will live in. */
:root{
  --ink:#17140F; --ink-2:#221E17; --line:#3A352C; --paper:#FFFFFF;
  --text:#F5F2EA; --muted:#B9B2A3; --gold:#C29A2B; --gold-hi:#EDD27C;
  --ok:#3E9B6A; --warn:#D08A3A;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-weight:800;font-variation-settings:"wdth" 62;text-transform:uppercase;font-size:24px;letter-spacing:.01em}
.brand b em{font-style:normal;background:linear-gradient(100deg,#9C7A22,#C29A2B 30%,#EDD27C 52%,#C29A2B 72%,#9C7A22);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.approve{background:var(--ok)} .dot.changes{background:var(--warn)}
.open{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.open:hover{color:var(--text)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
@media (max-width:1000px){.main{grid-template-columns:1fr}}
.stage{background:#0E0C09;position:relative;overflow:hidden;min-height:70vh}
.frame{position:absolute;top:0;left:50%;transform-origin:top center;background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.frame iframe{border:0;display:block;width:100%;height:100%}
.size{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.side{border-left:1px solid var(--line);padding:22px 20px;overflow:auto;display:flex;flex-direction:column;gap:22px}
@media (max-width:1000px){.side{border-left:0;border-top:1px solid var(--line)}}
.side h2{margin:0;font-weight:800;font-variation-settings:"wdth" 62;text-transform:uppercase;font-size:30px;line-height:.95;text-wrap:balance}
.q{font-size:16px;margin:8px 0 0}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verdict button{min-height:48px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid var(--line);background:none}
.verdict [data-v="approve"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.verdict [data-v="changes"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--ink)}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
label.lab{display:block;font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--text)}
.send{margin-top:8px;min-height:44px;width:100%;border:0;border-radius:4px;cursor:pointer;font-weight:750;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:linear-gradient(100deg,#9C7A22,#C29A2B 30%,#EDD27C 52%,#C29A2B 72%,#9C7A22)}
.send:disabled{opacity:.5;cursor:default}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.notes li{border-top:1px solid var(--line);padding-top:10px;font-size:14px;white-space:pre-wrap}
.notes time{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.look{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted);font-size:14px}
.look b{color:var(--text);font-weight:650}
.offline{font-size:13px;color:var(--warn)}
</style>

<header class="top">
  <div class="brand"><b>Lucky Golf <em>v4</em></b><span>Three pages, one colour scheme. Real photos only.</span></div>
  <div class="seg" role="group" aria-label="Page" id="pages">
    <button type="button" data-page="home" aria-pressed="true"><i class="dot" data-dot="home"></i>Home</button>
    <button type="button" data-page="carver" aria-pressed="false"><i class="dot" data-dot="carver"></i>Carver 01</button>
    <button type="button" data-page="polos" aria-pressed="false"><i class="dot" data-dot="polos"></i>Polos</button>
  </div>
  <div class="seg" role="group" aria-label="Device" id="devices">
    <button type="button" data-w="1440" aria-pressed="true">Desktop</button>
    <button type="button" data-w="834" aria-pressed="false">Tablet</button>
    <button type="button" data-w="390" aria-pressed="false">Phone</button>
  </div>
  <span class="size" id="size"></span>
  <a class="open" id="openNew" href="home.html" target="_blank" rel="noopener">Open full page</a>
</header>

<div class="main">
  <div class="stage" id="stage">
    <div class="frame" id="frame"><iframe id="view" src="home.html" title="Page under review"></iframe></div>
  </div>

  <aside class="side">
    <div>
      <h2 id="pageName">Home</h2>
      <p class="q">Would you buy from this?</p>
    </div>
    <div>
      <div class="verdict" role="group" aria-label="Your verdict">
        <button type="button" data-v="approve" aria-pressed="false">Approve</button>
        <button type="button" data-v="changes" aria-pressed="false">Needs changes</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
    <div>
      <label class="lab" for="note">What should change</label>
      <textarea id="note" placeholder="Be as blunt as you like. Name the section if you can: hero, price table, reviews..."></textarea>
      <button class="send" type="button" id="send">Save note</button>
    </div>
    <ul class="notes" id="notes" aria-label="Notes on this page"></ul>
    <div>
      <label class="lab">Look at on this page</label>
      <ol class="look" id="look"></ol>
    </div>
  </aside>
</div>

<script>
(function(){
  var PAGES = {
    home: {name:"Home", file:"home.html", look:[
      "<b>The price table.</b> Vokey, TaylorMade and Callaway list prices next to the Carver 01. It names the brands. Keep the names, or say \"leading brands\"?",
      "<b>The hero</b> is the real on-course photo. On phone the headline sits under the photo, not on top of it.",
      "<b>The five clubs</b> all sit on the same light-grey ground, at the same size. That is cleanup of the photos we have, not a reshoot.",
      "<b>Sold out</b> is marked on the Tracer Blade card."
    ]},
    carver: {name:"Carver 01", file:"carver-01.html", look:[
      "<b>Switch Gold to Black</b> in the buy box. The photos, price, lofts and copy all change. Black is right hand only, so Left hand disappears.",
      "<b>Struck-through lofts</b> are the real stock: the S grind is sold out in right hand today.",
      "<b>How many</b>: pick 2 or 3 and the price and extra loft pickers update.",
      "<b>Reviews</b> are the six newest Judge.me reviews at 4 stars and up, word for word. One mentions slow customer service. It stays in unless you say otherwise."
    ]},
    polos: {name:"Polos", file:"polos.html", look:[
      "<b>Filter</b> by Classic or Blade collar at the top of the grid.",
      "<b>No lifestyle photos.</b> There are none yet, so there are no empty boxes either. On-body shots slot into the same cards after the shoot.",
      "<b>Polo product pages</b> are not in this round. Clicking a polo says so."
    ]}
  };
  var page = "home", width = 1440, db = null, unsubDoc = null, unsubNotes = null;
  var $ = function(id){ return document.getElementById(id); };
  var frame = $("frame"), view = $("view"), stage = $("stage");

  function fit(){
    var avail = stage.clientWidth - 32;
    var s = Math.min(1, avail / width);
    var h = stage.clientHeight;
    frame.style.width = width + "px";
    frame.style.height = (h / s) + "px";
    frame.style.transform = "translateX(-50%) scale(" + s + ")";
    frame.style.top = width < 1000 ? "0" : "0";
    $("size").textContent = width + "px" + (s < 1 ? " shown at " + Math.round(s * 100) + "%" : "");
  }
  window.addEventListener("resize", fit);

  function render(){
    var p = PAGES[page];
    [].forEach.call(document.querySelectorAll("#pages button"), function(b){ b.setAttribute("aria-pressed", String(b.dataset.page === page)); });
    [].forEach.call(document.querySelectorAll("#devices button"), function(b){ b.setAttribute("aria-pressed", String(+b.dataset.w === width)); });
    if (view.getAttribute("src") !== p.file) view.setAttribute("src", p.file);
    $("openNew").href = p.file;
    $("pageName").textContent = p.name;
    $("look").innerHTML = p.look.map(function(l){ return "<li>" + l + "</li>"; }).join("");
    fit();
    watch();
  }

  document.getElementById("pages").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return; page = b.dataset.page; render();
  });
  document.getElementById("devices").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return; width = +b.dataset.w; render();
  });

  function setVerdictUI(v){
    [].forEach.call(document.querySelectorAll(".verdict button"), function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === v)); });
  }
  function when(iso){ try { return new Date(iso).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); } catch(e){ return ""; } }

  function watch(){
    if (!db) return;
    if (unsubDoc) unsubDoc(); if (unsubNotes) unsubNotes();
    var current = page;
    unsubDoc = db.doc("verdicts/" + current).onSnapshot(function(s){
      if (current !== page) return;
      var d = s.exists ? s.data() : null;
      setVerdictUI(d && d.verdict);
      $("status").textContent = d ? (d.verdict === "approve" ? "Approved " : "Marked needs changes ") + when(d.at) : "No verdict yet.";
    });
    unsubNotes = db.collection("notes").where("page", "==", current).onSnapshot(function(q){
      if (current !== page) return;
      var rows = q.docs.map(function(d){ return d.data(); }).sort(function(a,b){ return a.at < b.at ? 1 : -1; });
      var ul = $("notes"); ul.innerHTML = "";
      rows.forEach(function(r){
        var li = document.createElement("li");
        var t = document.createElement("time"); t.textContent = when(r.at);
        li.appendChild(t); li.appendChild(document.createTextNode(String(r.text || "")));
        ul.appendChild(li);
      });
    });
  }
  function watchDots(){
    Object.keys(PAGES).forEach(function(k){
      db.doc("verdicts/" + k).onSnapshot(function(s){
        var d = s.exists ? s.data() : null;
        var dot = document.querySelector('[data-dot="' + k + '"]');
        dot.className = "dot" + (d && d.verdict ? " " + d.verdict : "");
      });
    });
  }

  document.querySelector(".verdict").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (!db) { $("status").textContent = "Saving is not available in this view. Open the review link on claude.ai."; return; }
    var v = b.dataset.v; setVerdictUI(v);
    db.doc("verdicts/" + page).set({verdict: v, page: page, at: new Date().toISOString()})
      .catch(function(err){ $("status").textContent = "Not saved: " + (err && err.message || "try again"); });
  });
  $("send").addEventListener("click", function(){
    var text = $("note").value.trim(); if (!text) { $("note").focus(); return; }
    if (!db) { $("status").textContent = "Saving is not available in this view. Open the review link on claude.ai."; return; }
    $("send").disabled = true;
    db.collection("notes").add({page: page, text: text.slice(0, 4000), at: new Date().toISOString()})
      .then(function(){ $("note").value = ""; $("status").textContent = "Note saved."; })
      .catch(function(err){ $("status").textContent = "Not saved: " + (err && err.message || "try again"); })
      .then(function(){ $("send").disabled = false; });
  });

  render();
  if (window.claude && claude.use) {
    claude.use("db").then(function(d){
      if (!d) { $("status").textContent = "Saving is off in this view. You can still look through every page."; return; }
      db = d; watch(); watchDots();
    });
  }
})();
</script>
