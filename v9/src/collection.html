<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · Lucky Golf</title>
{{HEAD}}
<style>
/* ---------- The everyday collection · one template, any collection ---------- */
.head{padding-bottom:clamp(20px,3vw,32px)}
.bar{position:sticky;top:var(--lg-head-h,64px);z-index:22;background:var(--lg-page);border-block:1px solid var(--lg-rule);margin-top:clamp(24px,3vw,40px)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px}
.fg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fg .lbl{font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 78;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--lg-ink-64)}
.fg button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--lg-rule);background:var(--lg-page);color:var(--lg-ink);font-size:var(--lg-fs-sm);cursor:pointer}
.fg button[aria-pressed="true"]{background:var(--lg-ink);color:var(--lg-page);border-color:var(--lg-ink)}
.fright{margin-left:auto;display:flex;align-items:center;gap:16px}
.count{font-size:var(--lg-fs-sm);color:var(--lg-ink-64)}
.count b{font-variation-settings:'wdth' 66;font-weight:800}
.fright select{min-height:40px;border-radius:999px;border:1px solid var(--lg-rule);background:var(--lg-page);color:var(--lg-ink);padding:0 12px;font:inherit;font-size:var(--lg-fs-sm)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--lg-gut);padding-block:clamp(24px,3vw,40px)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.it{display:flex;flex-direction:column}
.it[hidden]{display:none}
.it-ph{position:relative;aspect-ratio:4/5;border-radius:var(--lg-r-card);overflow:hidden;background:var(--lg-tile)}
.it-ph img{width:100%;height:100%;object-fit:contain;padding:16px}
.it[data-dead] .it-ph img{opacity:.55}
.it-bd{display:block;padding-top:12px;color:inherit;text-decoration:none}
.it-bd .nm{display:block;font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 70;font-weight:700;text-transform:uppercase;font-size:15px;line-height:1.15}
.it-bd b{display:block;margin-top:4px;font-weight:600}
.it-bd .meta{display:block;margin-top:2px;color:var(--lg-ink-64);font-size:var(--lg-fs-sm)}
.it .lg-tag{position:absolute;left:10px;top:10px}
.empty{text-align:center;color:var(--lg-ink-64);padding:48px 0}
</style>
</head>
<body class="lg">
{{HEADER}}

<main>
<nav class="crumb lg-wrap" aria-label="Breadcrumb"><ol><li><a href="home.html">Home</a></li><li><span aria-current="page">{{TITLE}}</span></li></ol></nav>

<section class="lg-wrap head">
  <p class="lg-eyebrow">{{EYEBROW}}</p>
  <h1 class="lg-d1">{{TITLE}}</h1>
  <p class="lg-lede" style="max-width:58ch">{{LEDE}}</p>
</section>

<div class="lg-pband" aria-label="Lucky on the course">{{PBAND}}</div>

<div class="bar"><div class="lg-wrap bar-in">
  <div class="fg" role="group" aria-label="Kind"><span class="lbl">Kind</span>{{KINDS}}</div>
  <div class="fg" role="group" aria-label="Availability"><span class="lbl">Show</span>
    <button type="button" data-f="stock" data-v="" aria-pressed="true">Everything</button>
    <button type="button" data-f="stock" data-v="in" aria-pressed="false">In stock</button>
  </div>
  <div class="fright">
    <span class="count"><b id="shown">{{COUNT}}</b> of {{COUNT}}</span>
    <label><span class="sr">Sort</span><select id="sort"><option value="featured">Featured</option><option value="best">Best selling</option><option value="az">Alphabetically, A to Z</option><option value="za">Alphabetically, Z to A</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option><option value="new">Date, new to old</option><option value="old">Date, old to new</option></select></label>
  </div>
</div></div>

<section class="lg-wrap">
  <div class="grid" id="grid">{{CARDS}}</div>
  <p class="empty" id="empty" hidden>Nothing matches that. <button class="lg-btn-line lg-btn-sm" type="button" data-reset>Clear the filters</button></p>
</section>

<div class="lg-wrap">{{RELATED}}</div>

<section class="lg-signoff"><div class="lg-wrap">
  <p class="lg-eyebrow">The last word</p>
  <h2 class="lg-d1">{{SIGNHEAD}}</h2>
  <p class="lg-lede">{{SIGNLEDE}}</p>
  <a class="lg-btn-line" href="#grid">Back to the top <span aria-hidden="true">&uarr;</span></a>
  <div class="lg-signoff-mags" aria-hidden="true"><span class="lg-mags"><img class="is-ink" src="img/mags-ink.webp" alt=""><img class="is-light" src="img/mags-light.webp" alt=""></span></div>
</div></section>
</main>

{{FOOTER}}
{{DRAWER}}
{{SCRIPTS}}
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return [].slice.call(document.querySelectorAll(s)); };
  var grid = $('#grid'), cards = $$('.it', grid), tiles = $$('.ftile', grid), f = { kind: '', stock: '' };
  /* the feature tile sits before the Nth visible card, whatever the filter or sort */
  function place(){ var seq = cards.filter(function(c){ return !c.hidden; }).sort(function(a, b){
      return [].indexOf.call(grid.children, a) - [].indexOf.call(grid.children, b); });
    tiles.forEach(function(t){ var at = seq[+t.dataset.pos]; if (at) grid.insertBefore(t, at); else grid.appendChild(t); }); }

  function paint(){
    var n = 0;
    cards.forEach(function(c){
      var ok = (!f.kind || c.dataset.kind === f.kind) && (!f.stock || !c.hasAttribute('data-dead'));
      c.hidden = !ok; if (ok) n++;
    });
    $('#shown').textContent = n;
    $('#empty').hidden = n > 0; place();
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('.fg button');
    if (b){ var k = b.dataset.f; f[k] = (f[k] === b.dataset.v) ? '' : b.dataset.v;
      $$('.fg button[data-f="' + k + '"]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.v === f[k])); });
      paint(); return; }
    if (e.target.closest('[data-reset]')){ f.kind = f.stock = '';
      $$('.fg button').forEach(function(x){ x.setAttribute('aria-pressed', String(!x.dataset.v)); }); paint(); return; }
  });
  $('#sort').addEventListener('change', function(){
    var v = this.value, list = cards.slice(), n = function(el, k){ return +el.dataset[k] || 0; };
    if (v === 'az') list.sort(function(a, b){ return a.dataset.name.localeCompare(b.dataset.name); });
    else if (v === 'za') list.sort(function(a, b){ return b.dataset.name.localeCompare(a.dataset.name); });
    else if (v === 'low') list.sort(function(a, b){ return n(a, 'price') - n(b, 'price'); });
    else if (v === 'high') list.sort(function(a, b){ return n(b, 'price') - n(a, 'price'); });
    else if (v === 'best') list.sort(function(a, b){ return n(a, 'best') - n(b, 'best'); });
    else if (v === 'new') list.sort(function(a, b){ return n(b, 'new') - n(a, 'new'); });
    else if (v === 'old') list.sort(function(a, b){ return n(a, 'new') - n(b, 'new'); });
    else list.sort(function(a, b){ return n(a, 'i') - n(b, 'i'); });
    list.forEach(function(c){ grid.appendChild(c); }); place();
  });
  place();
})();
</script>
</body>
</html>
