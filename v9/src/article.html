<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · Lucky Golf</title>
<meta name="description" content="{{DESC}}">
{{HEAD}}
<style>
/* ---------- Article · one column, wide photo, nothing in the way of reading ---------- */
.art{max-width:72ch;margin-inline:auto}
.art .meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--lg-ink-64);font-size:var(--lg-fs-sm);margin-bottom:14px}
.art h1{margin:0 0 18px}
.hero{border-radius:var(--lg-r-card);overflow:hidden;background:var(--lg-tile);margin-block:clamp(22px,3vw,36px)}
.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.art p{margin:0 0 18px;color:var(--lg-ink-70);font-size:var(--lg-fs-body);line-height:1.62}
.art h2{margin:clamp(28px,3.5vw,44px) 0 12px;font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 66;font-weight:800;
  text-transform:uppercase;font-size:clamp(20px,2.2vw,26px);line-height:1.1}
.art ul{margin:0 0 18px;padding-left:20px;color:var(--lg-ink-70);display:grid;gap:8px}
.pull{margin:clamp(28px,3.5vw,44px) 0;padding-left:20px;border-left:3px solid var(--lg-gold);
  font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 74;font-weight:700;font-size:clamp(19px,2.1vw,24px);line-height:1.25}
.inline-buy{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:center;margin:clamp(28px,3.5vw,44px) 0;
  padding:18px;border:1px solid var(--lg-rule);border-radius:var(--lg-r-card)}
@media (max-width:640px){.inline-buy{grid-template-columns:90px minmax(0,1fr);}.inline-buy .lg-btn{grid-column:2}}
.inline-buy .ph{aspect-ratio:1;border-radius:12px;background:var(--lg-tile);display:grid;place-items:center}
.inline-buy .ph img{width:100%;height:100%;object-fit:contain;padding:10px}
.inline-buy b{display:block;font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 70;font-weight:700;text-transform:uppercase;font-size:16px}
.inline-buy span{color:var(--lg-ink-64);font-size:var(--lg-fs-sm)}
.video{display:block;position:relative;border-radius:var(--lg-r-card);overflow:hidden;background:#000;margin:clamp(22px,3vw,36px) 0;color:#fff;text-decoration:none}
.video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.82}
.video .play{position:absolute;inset:0;display:grid;place-items:center}
.video .play i{width:74px;height:74px;border-radius:50%;background:var(--lg-gold);display:grid;place-items:center}
.video .play i:after{content:"";border-left:22px solid #111;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.video .cap{position:absolute;left:16px;bottom:14px;font-size:var(--lg-fs-sm);background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px}
.art ol{margin:0 0 18px;padding-left:22px;color:var(--lg-ink-70);display:grid;gap:10px}
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--lg-gut)}
@media (max-width:860px){.more{grid-template-columns:1fr}}
.mp{color:inherit;text-decoration:none}
.mp figure{margin:0 0 12px;border-radius:var(--lg-r-card);overflow:hidden;background:var(--lg-tile)}
.mp img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.mp b{display:block;font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 68;font-weight:800;text-transform:uppercase;font-size:16px;line-height:1.15}
</style>
</head>
<body class="lg">
{{HEADER}}

<main>
<nav class="crumb lg-wrap" aria-label="Breadcrumb"><ol><li><a href="home.html">Home</a></li><li><a href="blog.html">All Things Lucky</a></li><li><span aria-current="page">{{CRUMB}}</span></li></ol></nav>

<article class="lg-sec" style="padding-top:clamp(12px,2vw,20px)"><div class="lg-wrap">
  <div class="art">
{{BODY}}
</div>
</div></article>

<section class="lg-sec" style="padding-top:0"><div class="lg-wrap">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 40px;margin-bottom:clamp(20px,3vw,32px)">
    <div><p class="lg-eyebrow">Keep reading</p><h2 class="lg-d2">More from the <span class="lg-foil-word">blog</span></h2></div>
    <a class="lg-link" href="blog.html">All articles <span>&rarr;</span></a>
  </div>
  <div class="more">{{MORE}}</div>
</div></section>

<section class="lg-signoff"><div class="lg-wrap">
  <p class="lg-eyebrow">The last word</p>
  <h2 class="lg-d1">{{SIGN_H}}</h2>
  <p class="lg-lede">{{SIGN_LEDE}}</p>
  <a class="lg-btn" href="{{SIGN_HREF}}">{{SIGN_BTN}}</a>
  <div class="lg-signoff-mags" aria-hidden="true"><span class="lg-mags"><img class="is-ink" src="img/mags-ink.webp" alt=""><img class="is-light" src="img/mags-light.webp" alt=""></span></div>
</div></section>
</main>

{{FOOTER}}
{{DRAWER}}
{{SCRIPTS}}
</body>
</html>
